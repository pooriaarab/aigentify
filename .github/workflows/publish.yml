name: Publish

# staging  -> publishes a prerelease to the npm `next` dist-tag
# production -> publishes package.json's version to the npm `latest` dist-tag
#
# Requires an npm automation token in the repo secret NPM_TOKEN.

on:
  push:
    branches: [staging, production]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run verify
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$GITHUB_REF_NAME" = "production" ]; then
            npm publish --access public
          else
            # unique throwaway prerelease version, not committed
            npm version prerelease --preid=next --no-git-tag-version
            npm publish --access public --tag next
          fi
